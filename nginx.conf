server {
    listen 80;
    server_name 192.168.6.40 localhost _;
    root /var/www/ErdeFlix/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    index index.php;
    charset utf-8;
    client_max_body_size 100M;

    access_log /var/log/nginx/erdeflix-access.log;
    error_log  /var/log/nginx/erdeflix-error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # --- HLS streaming ---
    location ~* \.(m3u8)$ {
        types { application/vnd.apple.mpegurl m3u8; }
        add_header Cache-Control "no-cache";           # playlists change/rotate
        add_header Access-Control-Allow-Origin "*";     # loosen/restrict as needed
        access_log off;
    }

    location ~* \.(ts|m4s|mp4)$ {
        types {
            video/mp2t ts;
            video/mp4 m4s mp4;
        }
        add_header Cache-Control "public, max-age=31536000, immutable"; # segments are static once written
        add_header Access-Control-Allow-Origin "*";
        add_header Accept-Ranges bytes;   # enables seeking
        access_log off;
    }

    # general static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
